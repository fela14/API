<div class="mb-3 border p-3 rounded row">
    <div class="col-10">
        <h4 class="text-secondary">{{ job['title'] }}</h4>
        <div><b>Location:</b> {{ job['location'] }}</div>
        {% if job['salary'] %}
            <div>
                <b>Salary:</b> ${{ job['salary'] }} {% if job['currency'] %}{{ job['currency'] }}{% endif %}
            </div>
        {% else %}
            <div><b>Salary:</b> Not disclosed</div>
        {% endif %}
    </div>
    <div class="col-2">
        <a href="mailto:kfakeye14.2@gmail.com?subject=Application%20for%20{{job['title']}}&body=Name%3A%20%3Cyour%20name%20here%3E%0D%0AResume%3A%20%3Cresume%20link%20here%3E%0D%0ALinkedIn%20(Optional)%3A%20%3Clinkedin%20like%20here%3E" 
           class="btn btn-outline-primary" target="_blank">Apply</a>
    </div>
</div>
