<div class="mb-3 border p-3 rounded row">
    <div class="col-10">
        <h4 class="text-secondary">{{ job['title'] }}</h4>
        <div><b>Location:</b> {{ job['location'] }}</div>
        {% if job['salary'] %}
            <div>
                <b>Salary:</b> ${{ job['salary'] }} {% if job['currency'] %}{{ job['currency'] }}{% endif %}
            </div>
        {% else %}
            <div><b>Salary:</b> Not disclosed</div>
        {% endif %}
    </div>
    <div class="col-2">
        <a href="/job/{{ job['id'] }}" 
           class="btn btn-outline-primary" target="_blank">Apply</a>
    </div>
</div>
